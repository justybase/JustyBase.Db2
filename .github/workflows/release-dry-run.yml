name: Release dry run

# Manual only: builds and verifies both packages, then uploads them as workflow artifacts.
# No registry credentials, no publish. Every verification step uses the same packed artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build, pack and verify (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.112
            11.0.100-rc.2.26504.105

      - name: Restore solution projects
        run: |
          dotnet restore src/Db2.Tests/Db2.Tests.csproj --nologo -v q
          dotnet restore src/Db2.IBMCompat/Db2.IBMCompat.csproj --nologo -v q

      - name: Build Release
        run: |
          dotnet build src/Db2.Tests/Db2.Tests.csproj -c Release --no-restore --nologo -v q
          dotnet build src/Db2.IBMCompat/Db2.IBMCompat.csproj -c Release --no-restore --nologo -v q

      - name: Offline unit, protocol and API surface tests
        run: >-
          dotnet test src/Db2.Tests/Db2.Tests.csproj -c Release --no-build --nologo -v q
          --filter 'FullyQualifiedName!~Live&Category!=Live&Category!=Db2Integration&Category!=KerberosIntegration&Category!=Secmec9Integration&Category!=Secmec7Integration'
          --logger 'trx;LogFileName=offline.trx'
          --results-directory '${{ runner.temp }}/offline-test-results'

      - name: Reject skipped offline tests
        run: python3 scripts/check-trx-no-skips.py '${{ runner.temp }}/offline-test-results/offline.trx'

      - name: Pack both packages once
        run: |
          rm -rf release-out && mkdir release-out
          dotnet pack src/Db2.Driver/Db2.Driver.csproj -c Release --no-restore --nologo -v q -o release-out
          dotnet pack src/Db2.IBMCompat/Db2.IBMCompat.csproj -c Release --no-restore --nologo -v q -o release-out

      - name: Package contents and allowlist validation
        run: python3 tools/sbom/check_package_contents.py release-out

      - name: Consumer smoke test against the packed artifacts
        run: python3 tests/PackageConsumer/run_package_consumer_smoke.py release-out

      - name: Generate SBOM per package (offline)
        run: python3 tools/sbom/generate_cs_sbom.py release-out

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: JustyBase.Db2-release-dry-run
          path: release-out/
          if-no-files-found: error
